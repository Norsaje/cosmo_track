# braining.space — демо-стенд cosmo_track (Космохакатон, кейс «Агропульс»).
#
# TLS терминируется здесь тем же wildcard-сертификатом *.braining.space, что и
# раньше: домен не менялся, поменялось только то, что за ним стоит. Всё уходит
# в контейнер web демо-стенда на 127.0.0.1:8080, а он уже сам разбирает статику,
# /api/ (в контейнер api) и /tiles/ (кэширующий прокси подложки карты).
#
# Прежняя конфигурация Braining закомментирована в braining.space.conf, оригинал
# сохранён рядом файлом .bak-<дата>. Поддомены id. и tg. не затронуты.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name braining.space;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name braining.space;

    ssl_certificate     /etc/letsencrypt/live/braining.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/braining.space/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # Кликджекинг: интерфейс с картой и кнопкой удаления поля не должен
    # открываться в чужом фрейме.
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # Тело запроса небольшое: сюда приходит только JSON с геометрией полигона.
    # Мегабайта хватает контуру в тысячи вершин, а лимит вершин всё равно
    # проверяет API.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    # Тайлы (image/png) уже сжаты, повторное сжатие только тратит процессор.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Схему передаём явно: за прокси приложение иначе считает соединение
        # незашифрованным и может собрать ссылку на http://.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Анализ идёт в воркере, а HTTP-ответы короткие: длинные таймауты здесь
        # не нужны и только держали бы соединения при недоступном контейнере.
        proxy_read_timeout    60s;
    }
}
