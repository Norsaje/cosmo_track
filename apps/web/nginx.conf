# Кэш тайлов карты. Объявляется до server{}: proxy_cache_path — директива уровня
# http, а файлы из conf.d включаются именно туда.
#
# 200 МБ и семь дней хранения выбраны под демо: тайлы одного региона занимают
# десятки мегабайт, а неделя переживает и подготовку, и сам показ. Кэш заодно
# выполняет пункт demo-чеклиста про офлайн-подложку: однажды открытая область
# продолжает показываться, даже если внешняя сеть пропала.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m
                 max_size=200m inactive=7d use_temp_path=off;

server {
    # Порт 8080: контейнер работает под пользователем nginx, порты ниже 1024 недоступны.
    # IPv6 объявляем явно: штатный скрипт образа 10-listen-on-ipv6-by-default.sh
    # правит конфиг от root и под non-root молча пропускает эту строку, а `localhost`
    # внутри контейнера резолвится в ::1 — healthcheck получал бы Connection refused
    # при полностью исправном nginx.
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker. Без резолвера nginx разрешает имя `api` один раз при
    # загрузке конфига и падает с `host not found in upstream`, если api ещё не поднят,
    # а после пересоздания api держится за устаревший IP и вечно отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
        # Страница — единый файл с разметкой и скриптом, и меняется она при каждой
        # пересборке фронта. Без no-cache браузер держит предыдущую версию из
        # эвристического кэша, и после обновления пользователь видит старый
        # интерфейс со старыми ошибками — при полностью исправном сервере.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Фронт ходит в API через тот же origin — так CORS не нужен браузеру,
    # а allowlist на стороне API остаётся для прямых вызовов.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Клиентский трейс не затираем: если заголовок пришёл, он и уходит дальше.
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Подложка карты проксируется через нас, а не запрашивается браузером напрямую.
    # Причина фактическая: стенд открывают с чужой машины, и у браузера доступа к
    # tile.openstreetmap.org может не быть — карта тогда пустая при исправном
    # сервере. У сервера доступ есть, поэтому тайлы идут его каналом.
    #
    # OSM tile usage policy требует валидный User-Agent и не допускает массового
    # скачивания: поэтому здесь кэш, а не сквозной прокси, и осмысленный UA
    # с именем проекта. Attribution остаётся на карте.
    location /tiles/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "cosmo_track/0.1 (agropulse demo)";
        # Заголовки клиента дальше не идут: куки и Referer в запросе к тайлам
        # не нужны никому, а лишние данные наружу — это утечка.
        proxy_set_header Cookie "";
        proxy_set_header Referer "";

        proxy_cache tiles;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1h;
        # Запрос за одним тайлом идёт один: при промахе остальные ждут его,
        # а не бомбят OSM параллельно — этого прямо требует их политика.
        proxy_cache_lock on;
        # Отдаём устаревший тайл, когда источник недоступен: карта на демо важнее
        # свежести подложки, которая меняется раз в месяцы.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Tile-Cache $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        expires 7d;
    }

    location /health/ {
        set $api_health http://api:8000;
        proxy_pass $api_health;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
    }
}
